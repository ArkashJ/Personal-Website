            - list [ref=e219]:
              - listitem [ref=e220]: Anthropic ARR $9B → $44B+; inference GM 38% → 70%+. Labs are now the value capture layer.
              - listitem [ref=e221]: Opus blended price ~$0.99/MTok on agentic workloads (300:1 input:output, 90%+ cache hits).
              - listitem [ref=e222]: "GB300 → VR NVL72 capex/W: $37.4 → $38.1 — flat despite 2x perf/W. Nvidia is intentionally under-pricing."
