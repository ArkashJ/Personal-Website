            - paragraph [ref=e326]: Did your Spotify 2022 wrap-up show an embarrassingly large amount of time listening to true crime podcasts? May we recommend something new?
            - paragraph [ref=e327]:
              - text: The number of podcasts has steadily risen over the past decade, as more Americans tune in to the spoken word. In the second quarter of 2022, 29 percent of 13-to-34 year olds listened to a podcast
              - link "daily" [ref=e328] [cursor=pointer]:
                - /url: https://www.edisonresearch.com/podcast-listening-a-mid-year-check-in/
              - text: .
            - paragraph [ref=e329]:
              - link "WTBU" [ref=e330] [cursor=pointer]:
                - /url: https://sites.bu.edu/wtbu/
              - text: ", BU’s award-winning student-run radio station, produces over a dozen affiliated student"
              - link "podcasts" [ref=e331] [cursor=pointer]:
                - /url: https://sites.bu.edu/wtbu/podcasts/
              - text: ", with new ones added each semester. The radio station is run by an executive board of approximately"
              - link "20 students" [ref=e332] [cursor=pointer]:
                - /url: https://sites.bu.edu/wtbu/interact/contact-us/
              - text: and has been overseen by WTBU faculty advisor
              - link "Anne Donohue" [ref=e333] [cursor=pointer]:
                - /url: https://www.bu.edu/com/profile/anne-donohue/
              - text: (COM’88), a College of Communication associate professor of journalism, since 1996 (Donohue is retiring this month). The general podcasts are overseen by audio productions director Shandra Back (COM’25), and the
              - link "sports" [ref=e334] [cursor=pointer]:
                - /url: https://sites.bu.edu/wtbu/sports/
              - text: and
              - link "news" [ref=e335] [cursor=pointer]:
                - /url: https://sites.bu.edu/wtbu/news/
              - text: podcasts are produced by their own separate WTBU departments.
            - paragraph [ref=e336]: “If you’re in the car, if you’re eating, if you’re running, whatever, it’s so simple to pop on a podcast, as opposed to sitting down to read an article or turning on your TV,” Back says about why she believes podcasts have risen in popularity. “This is an activity that can be done anywhere, anytime, as long as you have access to headphones and a way to listen.”
            - paragraph [ref=e337]:
              - text: The WTBU podcast studio on COM’s third floor was
              - link "renovated" [ref=e338] [cursor=pointer]:
                - /url: https://www.bu.edu/articles/2017/wtbu-rebounds-from-2016-fire/
              - text: in 2017 following a
              - link "three-alarm fire" [ref=e339] [cursor=pointer]:
                - /url: https://www.bu.edu/articles/2016/fire-at-com-forces-evacuation/
              - text: in March 2016 that destroyed the WTBU studios. And even though the station receives most of its funding and is directly affiliated with
              - link "COM" [ref=e340] [cursor=pointer]:
                - /url: https://sites.bu.edu/wtbu/interact/about-us/
              - text: ", students from all colleges and majors can join."
            - paragraph [ref=e341]: Back says that a lot goes into producing a podcast beyond a great idea. The station received about 30 podcast pitches last spring, and she says the most successful show applications are those that come with a plan, which include a synopsis, episode ideas, a posting schedule, and even graphics.
            - paragraph [ref=e342]:
              - text: “It’s anyone from any major, coming into COM and producing this content,” says Back, who also hosts her own travel-inspired podcast called
              - emphasis [ref=e343]: Sunshine on a Dime
              - text: . “All of our podcasts are so different, and I think that’s what makes our department so strong. We have a lot of diversity in the topics, subjects, and people producing our podcasts.”
            - paragraph [ref=e344]: Ready to start listening? Check out this list of current WTBU podcasts.
            - heading "General podcasts" [level=3] [ref=e345]
            - heading "The Block Is Hot" [level=4] [ref=e347]:
              - link "The Block Is Hot" [ref=e348] [cursor=pointer]:
                - /url: https://anchor.fm/theblockbu/episodes/Decisions-Decisions-e1p4rb0
                - emphasis [ref=e349]: The Block Is Hot
            - paragraph [ref=e350]:
              - text: Created by Leah McFarlane (COM’25), Symone Pettis (CAS’25), and Tsega Seleshi (CAS’25),
              - emphasis [ref=e351]: The Block Is Hot
              - text: gives listeners a moment in their day to feel connected, related to, and loved. Discussing topics such as college, society, and life, the podcast asks listeners to “come as you are, bring what you can, and just vibe.”
            - heading "The Forgotten Artist" [level=4] [ref=e352]:
              - link "The Forgotten Artist" [ref=e353] [cursor=pointer]:
                - /url: https://anchor.fm/the-forgotten-artist/episodes/Episode-9---Milli-Vanilli-e1q68nk
                - emphasis [ref=e354]: The Forgotten Artist
            - paragraph [ref=e355]:
              - text: Created by Jonny Leonidas (COM’25) and Helen Roth (Pardee’25), this podcast highlights overlooked or neglected musicians of the past. Now in its second season, recent featured artists include Milli Vanilli, Israel Kamakawiwoʻole, and Nick Drake.
              - emphasis [ref=e356]: The Forgotten Artist
              - text: also features lesser-known Boston-based artists.
            - heading "Sunshine on a Dime" [level=4] [ref=e357]:
              - link "Sunshine on a Dime" [ref=e358] [cursor=pointer]:
                - /url: https://anchor.fm/sunshinedime/episodes/Travel-Regret-e1r26nm
                - emphasis [ref=e359]: Sunshine on a Dime
            - paragraph [ref=e360]:
              - text: If the idea of planning a vacation overwhelms you,
              - emphasis [ref=e361]: Sunshine on a Dime
              - text: can help you map it all out. Host Shandra Back (COM’24), along with editor Jessie O’Leary (COM’25) and social media manager Ella Stonich (COM’24), interviews travelers and shares stories, tips, and resources to make sure you book that trip, no matter your budget, agenda, or companion-status. Recent episode topics include travel regret, mental health abroad, travel safety, hostel hopping, and solo traveling.
            - heading "(Dis)Integration" [level=4] [ref=e362]:
              - link "(Dis)Integration" [ref=e363] [cursor=pointer]:
                - /url: https://anchor.fm/dis-integration/episodes/Bonus-Joan-Diver-e1j0par
                - emphasis [ref=e364]: (Dis)Integration
            - paragraph [ref=e365]:
              - text: Is Boston really the most racist city in America?
              - emphasis [ref=e366]: (Dis)Integration
              - text: ", created last year by a COM podcasting class taught by Donohue, discusses the history and ongoing impact of busing and the desegregation of Boston Public Schools in the 1970s. The podcast won"
              - link "two national awards" [ref=e367] [cursor=pointer]:
                - /url: https://www.bu.edu/com/articles/student-podcast-on-bostons-busing-history-nets-two-awards/
              - text: from the Public Media Journalists Association.
            - heading "Biz Buzz" [level=4] [ref=e368]:
              - link "Biz Buzz" [ref=e369] [cursor=pointer]:
                - /url: https://anchor.fm/biz-buzz/episodes/Early-Careers--the-Good-the-Bad-the-Ugly-with-Kate-Schwenn-e1r3du5
                - emphasis [ref=e370]: Biz Buzz
            - paragraph [ref=e371]:
              - text: Created by Abigail Gilroy (Questrom’25), Alejandra Hoenigsberg (Questrom’25), Sophie Velychko (Questrom’25), Tiffney Chen (Questrom’25), Jacob Godshall (Questrom’25), and Matthew D’Alessandro (Questrom’25),
              - emphasis [ref=e372]: Biz Buzz
              - text: takes on the conversation surrounding business for students. Tune in to hear students, professors, and industry professionals give their take on corporate America.
            - heading "STU STREET" [level=4] [ref=e373]:
              - link "STU STREET" [ref=e374] [cursor=pointer]:
                - /url: https://anchor.fm/stu-street/episodes/Ep--14---Im-not-the-best-at-school--but-I-am-the-best-photographer-in-town-e1qu26i
                - emphasis [ref=e375]: STU STREET
            - figure "Hosts Arkash Jain (ENG’24, CAS’24), Sam Morra (CGS’22, Questrom’24), and Michael Dupre (CGS’22, CAS’24) recording a recent episode of their podcast STU STREET. Photo by Ava Ryder" [ref=e377]:
              - 'img "Photo: Hosts Arkash Jain (ENG’24, CAS’24), Sam Morra (CGS’22, Questrom’24), and Michael Dupre (CGS’22, CAS’24) record a recent episode of their podcast STU STREET. Three young men sit around a grey table and large sound mixer and wear professional grade headphones as they laugh and talk into hanging microphones." [ref=e378]'
              - generic [ref=e379]:
                - text: Hosts Arkash Jain (ENG’24, CAS’24), Sam Morra (CGS’22, Questrom’24), and Michael Dupre (CGS’22, CAS’24) recording a recent episode of their podcast
                - emphasis [ref=e380]: STU STREET
                - text: . Photo by Ava Ryder
            - paragraph [ref=e381]:
              - text: Ever wonder how to start a business? What about pursuing a nontraditional path?
              - emphasis [ref=e382]: STU STREET
              - text: ", hosted by Arkash Jain (ENG’24, CAS’24), Sam Morra (CGS’22, Questrom’24), and Michael Dupre (CGS’22, CAS’24), features interviews with CEOs, athletes, professionals, models, and even students to give listeners insight on finding their career path. These interviews also introduce listeners to the various opportunities available within their community and to the people connected to those opportunities."
            - 'heading "As We Like It: Book Review Podcast" [level=4] [ref=e383]':
              - 'link "As We Like It: Book Review Podcast" [ref=e384] [cursor=pointer]':
                - /url: https://anchor.fm/aswelikeit-bookreview/episodes/Billionaire-Romance-Recommendations-e1r2lt8
                - emphasis [ref=e385]: "As We Like It: Book Review Podcast"
            - paragraph [ref=e386]: Love romance novels? You came to the right place! Join hosts Andy Morales (CAS’24) and Shafali Verma (CAS’24), two self-proclaimed romance book experts, as they discuss tropes, authors, popular books, and unpopular opinions and recommend some new books. Recent episode topics include Taylor Swift songs as books and “five-star” reads.
            - heading "CINEGAB" [level=4] [ref=e387]:
              - link "CINEGAB" [ref=e388] [cursor=pointer]:
                - /url: https://anchor.fm/cinegab/episodes/CINEGAB-Back-To-School-Summer-Movies-e1p3bnp
                - emphasis [ref=e389]: CINEGAB
            - paragraph [ref=e390]:
              - text: Created by Benjamin Roldan (CAS’24, COM’24) and Zoe Moore (COM’24),
              - emphasis [ref=e391]: CINEGAB
              - text: "discusses—and gossips about—popular movies and TV shows. Among recent topics: animated films, summer movies, motherhood in TV and films, and diversity (or lack thereof) in movies."
            - heading "Sports podcasts" [level=3] [ref=e392]
            - heading "Second Stringers" [level=4] [ref=e394]:
              - link "Second Stringers" [ref=e395] [cursor=pointer]:
                - /url: https://anchor.fm/secondstringers/episodes/Detroit-Lions-Are-A-Playoff-Team-e1r5gi0
                - emphasis [ref=e396]: Second Stringers
            - paragraph [ref=e397]:
              - emphasis [ref=e398]: Second Stringers
              - text: is your one-stop-shop for major sports news. Hosted by Griffin Morrill (COM’23, CAS’23), Joe Eachus (COM’24, CAS’24), and other contributors, the podcast covers it all, from championship-caliber players to rookies stealing the spotlight.
              - emphasis [ref=e399]: Second Stringers
              - text: promises to keep listeners “updated on all the need-to-know information about your favorite sports teams.”
            - heading "BU Hockey Show" [level=4] [ref=e400]:
              - link "BU Hockey Show" [ref=e401] [cursor=pointer]:
                - /url: https://soundcloud.com/wtbu/bu-hockey-show-november-11-2022
                - emphasis [ref=e402]: BU Hockey Show
            - paragraph [ref=e403]:
              - text: Join cohosts Justin Horlick (COM’26), Stevie Potter (COM’25), and Owen Gund (COM’23) (also a
              - emphasis [ref=e404]: BU Today
              - text: intern), as they discuss all things Boston University hockey. Covering both the men’s and women’s varsity teams, this podcast features interviews with players and coaches and gives listeners an in-depth analysis of recent games.
            - heading "Back of the Net" [level=4] [ref=e405]:
              - link "Back of the Net" [ref=e406] [cursor=pointer]:
                - /url: https://soundcloud.com/wtbu/back-of-the-net-episode-209-world-cup-special
                - emphasis [ref=e407]: Back of the Net
            - paragraph [ref=e408]: Football or soccer? Whatever you call it, stay up-to-date with the latest international football news. This weekly podcast, produced by cohosts Charlie DeMatteo (COM’25), Bobby Serafin (COM’25), and Harrison McGlashan (COM’25), provides recaps and reactions to the week’s games. The podcast recently discussed the controversial 2022 FIFA World Cup, currently happening in Qatar, with the final game on December 18.
            - heading "League Bound" [level=4] [ref=e409]:
              - link "League Bound" [ref=e410] [cursor=pointer]:
                - /url: https://open.spotify.com/show/7b5ZmEeKpSI9KbP2XR5OVr?si=skHiuxb1Rb2u5xZ2NR7g5g&nd=1
                - emphasis [ref=e411]: League Bound
            - paragraph [ref=e412]: Catch up on all NBA news, both on and off the court. This brand-new podcast, hosted by Eli Cloutier (COM’26), James Noyes (COM’26), and Finley Rogan (COM’26), features commentary on the latest from the NBA and special guest hosts who offer their own analysis of basketball headlines.
            - heading "Redshirts" [level=4] [ref=e413]:
              - link "Redshirts" [ref=e414] [cursor=pointer]:
                - /url: https://open.spotify.com/show/6OU69B8wGM60LmN33k6ICZ?si=umHmN3f2RKS3Rw0g3Xn7WQ&nd=1
                - emphasis [ref=e415]: Redshirts
            - paragraph [ref=e416]:
              - text: While
              - emphasis [ref=e417]: Redshirts
              - text: technically covers everything sports from the World Cup to MLB and BU hockey, hosts Brendan Nordstrom (COM’25) and Jeremy Gay (COM’25) are diehard NFL fans and admit that football talk dominates much of their show. Their passion is evident, and the show also includes debates, personal takes, and interviews with local experts.
            - heading "News podcasts" [level=3] [ref=e418]
            - heading "WTBU News Today" [level=4] [ref=e420]:
              - link "WTBU News Today" [ref=e421] [cursor=pointer]:
                - /url: https://anchor.fm/wtbu-news5/episodes/WTBU-News-Today-111822-e1quvh1
                - emphasis [ref=e422]: WTBU News Today
            - paragraph [ref=e423]:
              - emphasis [ref=e424]: WTBU News Today
              - text: is a daily news podcast produced by the WTBU news department. Launched in 2020, this quick podcast—often five minutes or less—brings listeners the latest headlines (both local and national), a weather report, and recent campus news.
              - link "WTBU" [ref=e425] [cursor=pointer]:
                - /url: https://sites.bu.edu/wtbu/
              - text: also produces a full news program every Tuesday and Thursday at 6 pm.
