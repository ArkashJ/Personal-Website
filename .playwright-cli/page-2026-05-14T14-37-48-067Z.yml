            - generic [ref=e35]: I graduated with a combined BA [Mathematics and Computer Science] and MS [Computer Science] from Boston University bringing with me experience from a Venture Capital Firm [Battery Ventures 2x sourcing intern, diligence intern - https://www.battery.com], BCH (through BU Spark] and a tech startup [Zerosync - https://www.zerosync.co]. My master's theses focused on Streaming & Event driven systems [more specifically, adaptive checkpointing in Flink] and Numerically Stable Momentum Based SGD Algorithms. My core passion lies System Design on which I write a monthly blog, [https://medium.com/@arkjain] highlighting various online algorithms for Stream Processing Engines, Sorting Algorithms, KV and Columnar Stores, Adaptive Techniques for Task Placement on the Cloud, ML etc.
