              - listitem [ref=e308]: "Avis: $99 (Mar 20) → $713 (Apr 21) → $182. Pentwater + SRS at 108% economic ownership via cash-settled swaps."
              - listitem [ref=e309]: "Total return swaps post-Archegos: still off-balance-sheet for the fund, banks hedge by buying the shares themselves."
              - listitem [ref=e310]: Section 16(b) matches lowest-buy with highest-sell — statutory profit decouples from actual P&L.
              - listitem [ref=e311]: Pentwater dodged 16(b) on a parallel fund; sold 4.3M shares for $1.75B in proceeds.
              - listitem [ref=e312]: "The arb idea: short interest >30% + creeping past the 16(b) disclosure threshold = self-reinforcing squeeze, no dilution to existing holders."
