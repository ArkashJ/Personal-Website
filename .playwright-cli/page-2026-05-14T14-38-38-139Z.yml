                        - paragraph [ref=e548]:
                          - text: There is little to no documentation out there on using infiniband for torch run properly. Our lab at Harvard spent a lot of time figuring this out and the above is a collection of our experiences. Its a bit more complicated to get to this point because although its as simple as using the
                          - code [ref=e549]: master_port
                          - text: and setting the
                          - code [ref=e550]: rdvz_endpoint
                          - text: ", one needs to understand the following:"
                        - list [ref=e551]:
                          - listitem [ref=e552]:
                            - text: see if they have infiniband working or not because using
                            - code [ref=e553]: ib
                            - text: for the
                            - code [ref=e554]: master_addr
                            - text: over localhost for torchrun makes trainings visibly faster because of better I/O ingestion.
                          - listitem [ref=e555]: Infiniband ports can be set to ethernet and we discovered that ours were defaulting to ETH instead of IB, thus knowing how to switch to IB is imperative. Doing so is very hard because minimal documentation on Nvidia and RedHat websites doesn't point to specific directions on how to do so. This debugging analysis came after hours and days of looking into every possible way to improve our training speeds. We found the command to switch to IB from ETH on the Nvidia A100 manual pertaining to the Mellanox switch.
                          - listitem [ref=e556]: Switching to RDMA over IB is drastically better because this protocol is designed to go directly to GPU while TCP/IP struggles with back-pressure or TCP congestion leading to packets being dropped and slowing downstream operations. So even if you have top of the line GPUs, if the I/O is poor, the trainings will be slow.
                          - listitem [ref=e557]: Once you have all that setup, knowing how to get the infiniband port and checking if its working or not by pinging it is important
                        - paragraph [ref=e558]:
                          - text: We discovered this over the last few months. We wanted to keep up with Meta's
                          - emphasis [ref=e559]: builder
                          - text: spirit of "work fast and breaking things" and decided to share our findings in an open source format. Many labs and academic environments need to squeeze the most performance they can get from their systems given budget constraints, thus we want to assist small scale ML projects to do so, and by implementing small networking changes they can see drastic improvements.
                        - paragraph [ref=e560]: I'd like for this to be added into the documentation rather than it being an issue and am happy to make a tutorial for it. Is there a template for making a pytorch tutorial. I can make a professional one with gifs and detailed instructions for users if this shall be added to the documentation officially. Please reach out to me via GitHub/email privately and we can share some of other findings that are we found were sparsely documented.
                      - toolbar "Reactions"
