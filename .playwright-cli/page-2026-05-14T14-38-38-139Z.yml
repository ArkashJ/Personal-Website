                    - heading "📚 The doc issue" [level=3] [ref=e210]
                    - paragraph [ref=e211]:
                      - text: The documentation can include more information on optimally using infiniband for running ML trainings using torchrun. It would be helpful to add the bash commands for users to see how to set the RDZV host to be the the infiniband url.
                      - emphasis [ref=e212]: For Nvidia GPUs
                    - paragraph [ref=e213]:
                      - strong [ref=e214]: Infiniband URL
                      - text: One can run
                      - code [ref=e215]: ifconfig
                      - text: and parse the list to look for a key starting with
                      - code [ref=e216]: ib
                      - text: (for example ib0 with inet of 10.1.0.12).
                    - paragraph [ref=e217]:
                      - strong [ref=e218]: Mellanox Ports and Link Layer
                      - text: Run
                      - code [ref=e219]: ibstat
                      - text: to get the list of mellanox ports and the link layer they are using.
                      - text: To verify the Mellanox ports being active or not, run
                      - code [ref=e220]: ibv_devinfo
                      - text: .
                    - paragraph [ref=e221]:
                      - strong [ref=e222]: Ping the port
                      - text: If you do not have RDMA over Infiniband protocol set, run
                      - code [ref=e223]: ping 10.x.0.y
                      - text: to see if you can reach the infiniband connection. If you have RDMA installed you can verify the write latency by using
                      - code [ref=e224]: ib_write_lat 10.x.0.y
                      - text: (to verify write run
                      - code [ref=e225]: ib_write_bw 10.x.0.y
                      - text: ).
                    - paragraph [ref=e226]:
                      - strong [ref=e227]: Understanding Mellanox configs
                      - text: Section 7.7.1 of the A100 manual states(
                      - link "https://docs.nvidia.com/dgx/pdf/dgxa100-user-guide.pdf" [ref=e228] [cursor=pointer]:
                        - /url: https://docs.nvidia.com/dgx/pdf/dgxa100-user-guide.pdf
                      - text: ) using mlx start and run
                      - code [ref=e229]: sudo mlxconfig -e query | egrep -e Device\|LINK_TYPE
                      - text: to see if you're using Infiniband or Ethernet.
                      - text: Run
                      - code [ref=e230]: sudo mlxconfig -y -d <device-path> set LINK_TYPE_P1=<config-number>
                      - text: to change the link type to IB.
                    - paragraph [ref=e231]:
                      - text: Finally, in your
                      - code [ref=e232]: ~/.bashrc
                      - text: ","
                      - code [ref=e233]: export MASTER_ADDR="10.x.0.y"
                      - text: . and set your RDZV_BACKEND to be $MASTER_ADDR:$MASTER_PORT. Our master port values are usually 8001, 5001 (similar to ones a react dev would use, just a personal preference).
                    - generic [ref=e234]:
                      - generic [ref=e235]: torchrun \ --nnodes 3 \ --nproc_per_node 8 \ --node_rank $NODE_RANK \ --max-restarts $NUM_ALLOWED_FAILURES \ --rdzv-id $RDZV_ID \ --rdzv-backend $RDZV_BACKEND \ --rdzv-endpoint $RDZV_ENDPOINT \ scripts/train/pretrain.py \
                      - button "Copy code to clipboard" [ref=e237] [cursor=pointer]:
                        - img [ref=e238]
                    - paragraph [ref=e241]: Maybe these can be incorporated into the documentation? Feel free to reach out to me personally to talk more about optimized trainings including setting FlashAttention, BFloat16, Webdatasets, reading directly from raid, FSDP etc.
                    - link "Image" [ref=e242] [cursor=pointer]:
