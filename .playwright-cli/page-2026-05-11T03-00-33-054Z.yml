      - paragraph [ref=e409]: The piece is long; this is what I'm taking forward.
      - heading "The migration (2023–25 → 2026)" [level=3] [ref=e410]
      - code [ref=e412]: "2023–2025 2026 (NOW) ┌────────────────┐ ┌────────────────┐ │ INFRASTRUCTURE │ │ MODEL LABS │ │ CAPTURES ALL │ ══════> │ CAPTURE ALL │ │ THE VALUE │ │ THE VALUE │ └────────────────┘ └────────────────┘ │ │ ▼ ▼ • Nvidia (+25% AH May'23) • Anthropic ARR: • Vistra +265% (2024) $9B → $44B+ • GE Vernova +146% (2024) • Inference margins: • SanDisk/WDC/Seagate/ 38% → 70%+ Micron all +200% (2025)"
      - paragraph [ref=e413]:
        - text: Through 2025 the value flowed to
        - strong [ref=e414]: picks-and-shovels
        - text: ":"
      - list [ref=e415]:
        - listitem [ref=e416]: Nvidia (the AH +25% print after May '23 was the kickoff).
        - listitem [ref=e417]:
          - text: "Memory cycle: SanDisk, WDC, Seagate, Micron all up"
          - strong [ref=e418]: ">200%"
          - text: in 2025.
        - listitem [ref=e419]:
          - text: "Power names: Vistra"
          - strong [ref=e420]: +265%
          - text: ", GE Vernova"
          - strong [ref=e421]: +146%
          - text: in 2024.
      - paragraph [ref=e422]:
        - text: 2026 is the inversion.
        - strong [ref=e423]: Anthropic ARR went from $9B to $44B+. Inference gross margins went from 38% to 70%+.
        - text: The labs that were "famously bad" on margins are now the value capture layer.
      - heading "Why each token is worth more" [level=3] [ref=e424]
      - paragraph [ref=e425]:
        - text: The agentic inflection (late 2025) means tasks that used to cost
        - strong [ref=e426]: thousands of dollars and tens of person-hours
        - text: now finish in
        - strong [ref=e427]: minutes for a few dollars in tokens
        - text: ". SemiAnalysis discloses its own internal spend:"
        - strong [ref=e428]: $10.95M annual run-rate on Claude tokens
        - text: ", ~30% of employee comp,"
        - strong [ref=e429]: ~5B tokens per employee per month
